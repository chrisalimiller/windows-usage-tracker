name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/UsageTracker.Core.Tests -c Release

      - name: Publish win-x64
        run: dotnet publish src/UsageTracker -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/win-x64

      - name: Publish win-arm64
        run: dotnet publish src/UsageTracker -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -o out/win-arm64

      - name: Publish Microsoft Store build
        run: |
          dotnet publish src/UsageTracker -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:StoreBuild=true -o out/store-x64
          dotnet publish src/UsageTracker -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:StoreBuild=true -o out/store-arm64

      - name: Package for the Microsoft Store
        shell: pwsh
        run: ./packaging/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsUsageTracker-Store
          path: out/store/*.msixbundle
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsUsageTracker-win-x64
          path: out/win-x64/WindowsUsageTracker.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsUsageTracker-win-arm64
          path: out/win-arm64/WindowsUsageTracker.exe
          if-no-files-found: error

  # On main, publish a GitHub release for the version in Directory.Build.props,
  # once per version, with both exes attached.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          path: artifacts

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir release
          cp artifacts/WindowsUsageTracker-win-x64/WindowsUsageTracker.exe "release/WindowsUsageTracker-$v-win-x64.exe"
          cp artifacts/WindowsUsageTracker-win-arm64/WindowsUsageTracker.exe "release/WindowsUsageTracker-$v-win-arm64.exe"
          cp artifacts/WindowsUsageTracker-Store/*.msixbundle release/
          gh release create "v$v" release/*.exe release/*.msixbundle \
            --target "$GITHUB_SHA" \
            --title "Windows Usage Tracker $v" \
            --generate-notes
